services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: hiremind
      POSTGRES_PASSWORD: hiremind_dev
      POSTGRES_DB: hiremind
    ports:
      # Host port is for GUI tools only; 5432 and 5433 are already taken on this machine
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hiremind -d hiremind"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    build:
      context: ./backend
      target: dev
    restart: unless-stopped
    # Secrets (JWT_SECRET, GEMINI_API_KEY, RESEND_API_KEY, EMAIL_FROM)
    env_file:
      - ./backend/.env
    environment:
      # Container networking only; these win over env_file
      NODE_ENV: development
      DATABASE_URL: postgresql://hiremind:hiremind_dev@postgres:5432/hiremind
      PORT: "5000"
      CORS_ORIGINS: http://localhost:5174
      APP_URL: http://localhost:5174
      STORAGE_DRIVER: local
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      # Linux deps and Prisma engines must not be shadowed by the Windows host copies
      - backend_node_modules:/app/node_modules
      - backend_prisma_client:/app/generated
      # Neutralises the host .env, which dotenv would otherwise apply with override: true
      - ./backend/.env.docker:/app/.env:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npm run dev"

  frontend:
    build:
      context: ./frontend
      target: dev
    restart: unless-stopped
    environment:
      # Browser-facing, so localhost rather than a service name
      VITE_API_URL: http://localhost:5000/api
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5174:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
  backend_node_modules:
  backend_prisma_client:
  frontend_node_modules:
